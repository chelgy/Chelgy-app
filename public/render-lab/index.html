<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Chelgy Render Lab</title>
<style>
  :root { --bg:#f7f5f2; --card:#fff; --ink:#1b1a19; --mute:#6f6a64; --line:#e4dfd8; --accent:#1b1a19; --accent-ink:#fff; --bar:#c9a46b; }
  @media (prefers-color-scheme: dark) { :root { --bg:#121110; --card:#1c1a19; --ink:#f2efe9; --mute:#a39d95; --line:#2e2b28; --accent:#f2efe9; --accent-ink:#121110; --bar:#c9a46b; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.45 -apple-system, BlinkMacSystemFont, "Inter", system-ui, sans-serif; }
  main { max-width:560px; margin:0 auto; padding:28px 16px 64px; }
  h1 { font-size:22px; letter-spacing:.02em; margin:0 0 4px; }
  p.lede { color:var(--mute); margin:0 0 22px; font-size:15px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:14px; }
  .card h2 { font-size:13px; text-transform:uppercase; letter-spacing:.08em; color:var(--mute); margin:0 0 12px; font-weight:600; }
  label.opt { display:flex; gap:10px; align-items:flex-start; padding:8px 0; cursor:pointer; }
  label.opt small { display:block; color:var(--mute); font-size:13px; }
  .row { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .row label { font-size:13px; color:var(--mute); display:block; margin-bottom:4px; }
  select, input[type=file] { width:100%; font:inherit; font-size:15px; padding:9px 10px; border:1px solid var(--line); border-radius:10px; background:var(--bg); color:var(--ink); }
  input[type=file] { padding:8px; font-size:14px; }
  button { font:inherit; font-weight:600; border:0; border-radius:12px; padding:14px 18px; background:var(--accent); color:var(--accent-ink); width:100%; cursor:pointer; }
  button:disabled { opacity:.45; cursor:default; }
  button.ghost { background:transparent; color:var(--ink); border:1px solid var(--line); padding:10px; width:auto; }
  .track { height:6px; background:var(--line); border-radius:6px; overflow:hidden; margin:14px 0 8px; }
  #bar { height:100%; width:0; background:var(--bar); transition:width .2s; }
  #status { font-size:14px; color:var(--mute); min-height:20px; }
  pre#log { white-space:pre-wrap; font:12.5px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; color:var(--mute); margin:10px 0 0; }
  video { width:100%; max-height:70vh; border-radius:10px; background:#000; display:block; }
  textarea { width:100%; height:140px; font:12px ui-monospace, Menlo, monospace; border:1px solid var(--line); border-radius:10px; padding:10px; background:var(--bg); color:var(--ink); }
  .actions { display:flex; gap:10px; margin:10px 0; flex-wrap:wrap; }
  a.dl { color:var(--ink); font-size:14px; align-self:center; }
</style>
</head>
<body>
<main>
  <h1>Chelgy Render Lab</h1>
  <p class="lede">Renders a Talking Head edit entirely on this device — its own video chip and graphics, no pods. Nothing is uploaded.</p>

  <div class="card">
    <h2>Footage</h2>
    <label class="opt"><input type="radio" name="src" id="src-test" checked>
      <span>Test clip, made on this device<small>Has a flash and a beep every 2s, so lip sync is measured automatically.</small></span></label>
    <label class="opt"><input type="radio" name="src" id="src-file">
      <span>My own clips (up to 2)<small>Real footage — check speed and how it looks.</small></span></label>
    <input type="file" id="file" accept="video/*" multiple>
  </div>

  <div class="card">
    <h2>Edit</h2>
    <div class="row">
      <div><label for="look">Look</label>
        <select id="look"><option value="kodak6">Kodak 6</option><option value="wolf">Wolf</option><option value="luxury">Luxury</option><option value="movie3">Movie 3</option><option value="timeless">Timeless</option><option value="none">No colour</option></select></div>
      <div><label for="footage">Shot on</label>
        <select id="footage"><option value="standard">Phone / standard</option><option value="sony">Sony S-Log3</option><option value="canon">Canon C-Log</option></select></div>
      <div><label for="len">Length (own clips)</label>
        <select id="len"><option value="15">15 seconds</option><option value="60" selected>1 minute</option><option value="180">3 minutes</option></select></div>
      <div><label>&nbsp;</label><label class="opt" style="padding:6px 0"><input type="checkbox" id="music" checked><span>Music under the voice</span></label></div>
    </div>
  </div>

  <button id="go">Render on this device</button>
  <div class="track"><div id="bar"></div></div>
  <div id="status"></div>

  <div class="card" id="result" hidden>
    <h2>Result</h2>
    <video id="video" controls playsinline></video>
    <div class="actions"><a class="dl" id="dl" download="chelgy-render-lab.mp4">Download the video</a></div>
  </div>

  <div class="card">
    <h2>Report</h2>
    <textarea id="json" readonly placeholder="Results appear here after a run."></textarea>
    <div class="actions"><button class="ghost" id="copy">Copy report</button></div>
    <pre id="log"></pre>
  </div>
</main>
<script type="module" src="./lab.bundle.js"></script>
</body>
</html>
