<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Teach it your voice — Chelgy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Jost:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#fff; --offwhite:#F7F6F4; --stone:#E8E6E1;
    --mid:#6B6B6B; --ink:#111; --green:#4CAF82; --red:#C0392B;
    --display:'Outfit',Helvetica,Arial,sans-serif;
    --body:'Jost',Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--cream);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
  .wrap{max-width:660px;margin:0 auto;padding:28px 20px 90px}
  h1{font-family:var(--display);font-size:30px;font-weight:600;letter-spacing:-.02em;margin:0 0 12px}
  .eyebrow{font-size:10px;letter-spacing:.18em;text-transform:uppercase;font-weight:700;color:var(--mid);margin-bottom:10px}
  p{font-size:16px;line-height:1.65;color:var(--mid);margin:0 0 22px}
  .panel{border:1px solid var(--stone);padding:20px;margin-bottom:24px}
  .bullet{display:flex;gap:12px;margin-bottom:11px}
  .bullet:last-child{margin-bottom:0}
  .dot{width:5px;height:5px;background:var(--ink);margin-top:8px;flex-shrink:0}
  .bullet div:last-child{font-size:14.5px;line-height:1.55;color:var(--ink)}
  button{font-family:var(--body);font-size:15px;font-weight:600;padding:13px 26px;cursor:pointer;
    border:1px solid var(--ink);background:transparent;color:var(--ink);letter-spacing:.02em;border-radius:0}
  button.fill,label.fill{background:var(--ink);color:var(--cream)}
  button.stop{background:var(--red);border-color:var(--red);color:#fff}
  button.ghost{border-color:var(--stone);color:var(--mid);font-weight:500;padding:13px 18px}
  button:disabled{opacity:.35;cursor:default}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .meter{position:relative;height:12px;background:var(--stone);overflow:hidden}
  .meter .zone{position:absolute;top:0;bottom:0;left:75%;width:15%;background:var(--green);opacity:.25}
  .meter .fill{position:absolute;top:0;bottom:0;left:0;width:0;background:var(--ink);transition:width 60ms linear}
  .meter .fill.hot{background:var(--red)}
  .meter .hold{position:absolute;top:0;bottom:0;width:2px;background:var(--mid);left:0}
  .mscale{display:flex;justify-content:space-between;font-size:10px;color:var(--mid);margin-top:5px;letter-spacing:.08em}
  .rail{display:flex;gap:2px;margin-bottom:8px}
  .rail i{flex:1;height:4px;background:var(--stone);cursor:pointer}
  .rail i.now{background:var(--mid)}
  .rail i.done{background:var(--ink)}
  .rail i.skip{background:repeating-linear-gradient(45deg,var(--stone),var(--stone) 2px,var(--mid) 2px,var(--mid) 4px)}
  .tally{display:flex;justify-content:space-between;font-size:11px;color:var(--mid);letter-spacing:.06em;margin-bottom:22px}
  .prompt{border:1px solid var(--stone);padding:26px 24px;margin-bottom:18px;background:var(--offwhite)}
  .ptext{font-family:var(--display);font-size:18px;font-weight:400;line-height:1.6;letter-spacing:-.005em;margin-bottom:14px;color:var(--ink)}
  .ptext.lead{font-size:22px;font-weight:500;line-height:1.5}
  .ptext.huge{font-size:56px;font-weight:700;line-height:1;letter-spacing:.06em;text-align:center;margin-bottom:6px}
  .phint{font-size:14px;color:var(--mid);line-height:1.55}
  .phint.center{text-align:center}
  .notebox{text-align:center;padding:6px 0 2px}
  .notelabel{font-family:var(--display);font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--mid);font-weight:700}
  .tuner{height:52px;position:relative;margin:16px 0 6px;border-top:1px solid var(--stone);border-bottom:1px solid var(--stone)}
  .tuner .center{position:absolute;left:50%;top:0;bottom:0;width:2px;background:var(--ink);opacity:.35}
  .tuner .needle{position:absolute;top:6px;bottom:6px;width:4px;background:var(--red);left:50%;transition:left 70ms linear}
  .tuner .needle.on{background:var(--green)}
  .tunerlabel{text-align:center;font-size:12px;color:var(--mid);letter-spacing:.08em}
  .verdict{border:1px solid var(--stone);padding:16px;margin-bottom:18px}
  .verdict.bad{border-color:var(--red)}
  .vtitle{font-size:15px;font-weight:600;margin-bottom:4px}
  .vbody{font-size:13.5px;color:var(--mid);line-height:1.5}
  .why{font-size:13.5px;color:var(--mid);line-height:1.55;margin-bottom:20px}
  .err{color:var(--red);font-size:14px;margin-bottom:16px;line-height:1.5}
  .bar{height:3px;background:var(--stone)}
  .bar span{display:block;height:100%;width:0;background:var(--ink)}
  .timer{font-family:var(--display);font-size:34px;font-weight:600;letter-spacing:-.02em;margin-bottom:4px}
  .timer.short{color:var(--mid)}
  audio{height:34px}
  .hide{display:none}
  @media (prefers-color-scheme:dark){
    :root{--cream:#0a0705;--offwhite:#141010;--stone:#2a2320;--mid:#8f867b;--ink:#efe9df;--green:#5fcf94;--red:#e0685f}
    button.fill,label.fill{color:#0a0705}
    button.stop{color:#fff}
  }
</style>

<body>
<div class="wrap" id="app"></div>

<script>
// ── Supabase + session (added: this page now uploads to your account, not just
// downloads). Same publishable key pattern as dataset-upload.html. ──────────
const SUPABASE_URL = "https://yuzvpmxbtjpqtapborhr.supabase.co";
const SUPABASE_KEY  = "sb_publishable_F_hsngWtnCkBZx9SpMDbSw_laaYfTor";
let session=null, userId=null, newProfileId=null, saving=false, saveMsg="", saveErr="";
const H = () => ({ apikey:SUPABASE_KEY, Authorization:"Bearer "+session.access_token });

async function login(email, pass){
  const r = await fetch(SUPABASE_URL+"/auth/v1/token?grant_type=password", {
    method:"POST", headers:{apikey:SUPABASE_KEY,"Content-Type":"application/json"},
    body:JSON.stringify({email, password:pass}) });
  const j = await r.json();
  if(!r.ok) throw new Error(j.error_description||j.msg||"Login failed");
  session=j; userId=j.user.id;
}

// Create a NEW voice profile so "newest wins" makes it active once trained.
// A failed train leaves it un-ready and the app keeps using the last ready one.
async function createProfile(name){
  const r = await fetch(SUPABASE_URL+"/rest/v1/voice_profiles", {
    method:"POST", headers:{...H(),"Content-Type":"application/json","Prefer":"return=representation"},
    body:JSON.stringify({ user_id:userId, name:name||"Singing voice", status:"recording" }) });
  const rows = await r.json();
  if(!r.ok || !rows.length) throw new Error((rows&&rows.message)||"Could not create a voice profile");
  return rows[0].id;
}

// Upload one clip to the bucket and register a voice_clips row (what
// train-voice.sh reads: take_id, section, storage_path, duration, seq).
async function saveClip(pid, take_id, section, blob, dur, seq){
  const path = userId+"/"+pid+"/clips/"+String(seq).padStart(3,"0")+"-"+section+"-"+take_id+".wav";
  const up = await fetch(SUPABASE_URL+"/storage/v1/object/voice/"+path, {
    method:"POST", headers:{...H(),"x-upsert":"true","Content-Type":"audio/wav"}, body:blob });
  if(!up.ok) throw new Error("upload "+up.status);
  const row = await fetch(SUPABASE_URL+"/rest/v1/voice_clips", {
    method:"POST", headers:{...H(),"Content-Type":"application/json"},
    body:JSON.stringify({ user_id:userId, profile_id:pid, take_id, section, storage_path:path, duration:dur, seq }) });
  if(!row.ok){ const e=await row.json().catch(()=>({})); throw new Error("register "+(e.message||row.status)); }
}

// ─────────────────────────────────────────────────────────────────────────────
// TARGET: 20 minutes of recorded audio.
// v1 shipped eighteen short prompts that summed to 2.5 minutes — enough for a
// weak model and nothing more. Total length is the single biggest lever on how
// much the finished voice actually sounds like the person.
// ─────────────────────────────────────────────────────────────────────────────
const TARGET_SEC = 1200;

// Minor thirds, C3 to C5. Any usable range sits inside this; the notes outside
// yours get skipped, and which ones you skip is itself useful information.
const TONES = [
  {n:"C3",hz:130.81},{n:"D#3",hz:155.56},{n:"F#3",hz:185.00},{n:"A3",hz:220.00},
  {n:"C4",hz:261.63},{n:"D#4",hz:311.13},{n:"F#4",hz:369.99},{n:"A4",hz:440.00},
  {n:"C5",hz:523.25}
];

// ── THE TAKES ────────────────────────────────────────────────────────────────
//
// SINGING ONLY. v2 asked for four read passages and four two-minute rambles —
// about seven and a half minutes of PURE SPEECH against five short singing
// prompts. RVC learns whatever it is fed, so the finished model sang in a
// talking voice, which is exactly the complaint. Speech is not merely unhelpful
// here, it is the thing that ruins the result.
//
// So every take below is sung, hummed or held. The reads and the "tell me about
// your worst job" prompts are gone. What is left is twenty minutes of a person
// making pitched sound the way they actually make it.
//
// The other half of the fix is tone: people sing the way they are ASKED to. If
// the prompt says "belt it", the model learns belting. Every hint here says to
// sing it the way you would alone in the car, at whatever volume is comfortable,
// because a model that matches your natural voice is the entire point.

const SONGS = [
  {t:"Sing a verse of any song you know by heart",
   h:"Whatever you would sing without thinking about it. Your volume, your style \u2014 don\u2019t perform it."},
  {t:"Sing the chorus of that same song, twice through",
   h:"Same feel. Repeating it is useful: the model hears the same notes twice."},
  {t:"Sing a different song \u2014 something slower",
   h:"A ballad, a lullaby, anything unhurried. Long notes are worth more than fast ones."},
  {t:"Sing something you would sing quietly",
   h:"Close to the mic, soft and breathy if that is how you sing. This is the sound the model copies."},
  {t:"Sing a song you loved as a teenager",
   h:"Words half-remembered is fine. Hum the parts you have forgotten."},
  {t:"Sing any song in a made-up language",
   h:"No real words. Frees you up to think about the sound instead of the lyrics."},
  {t:"Sing a melody you are making up right now",
   h:"It does not have to go anywhere. Wander."},
  {t:"Sing that made-up melody again, differently",
   h:"Same tune, softer or higher. Whatever changes it for you."},
  {t:"Sing the happy birthday song, twice through",
   h:"Any key that feels easy. Off-key is completely fine."},
  {t:"Sing a verse and chorus of one more song",
   h:"Last one. Pick whichever has been stuck in your head today."}
];

const HUMS = [
  {t:"Hum any melody with your mouth closed",
   h:"Forty seconds. Go high and low \u2014 wander around your range."},
  {t:"Hum the same melody with your mouth open, on AH",
   h:"Same tune, open vowel. The model hears the difference."},
  {t:"Sing OO up and down, slowly",
   h:"Slide up as high as feels easy, then back down. No strain \u2014 stop where it stops being comfortable."},
  {t:"Sing EE up and down, slowly",
   h:"Same slide, brighter vowel."}
];

// Minor thirds, C3 to C5. Any usable range sits inside this; the notes outside
// yours get skipped, and which ones you skip is itself useful information.
const TONES = [
  {n:"C3",hz:130.81},{n:"D#3",hz:155.56},{n:"F#3",hz:185.00},{n:"A3",hz:220.00},
  {n:"C4",hz:261.63},{n:"D#4",hz:311.13},{n:"F#4",hz:369.99},{n:"A4",hz:440.00},
  {n:"C5",hz:523.25}
];

const SEC_META = {
  sung:{name:"Songs", why:"The bulk of the data. Sing the way you actually sing \u2014 the model becomes whatever you feed it, so a soft breathy take here is what makes a soft breathy voice."},
  hum:{name:"Humming and vowels", why:"Held sound with no words. This is where the model learns your tone rather than your diction."},
  range:{name:"Your range", why:"Sing the note you hear. This is the only section that pins pitch \u2014 without a tone to sing against, people sing their speaking pitch every time."},
  dynamics:{name:"Soft and full", why:"Your voice changes character with volume. Without this the model only knows one version of you."}
};

// ── BUILD TAKE LIST ──────────────────────────────────────────────────────────
const TAKES = [];
SONGS.forEach((t,i)=>TAKES.push({id:"sg"+i,section:"sung",kind:"sing",text:t.t,hint:t.h,minDur:45}));
HUMS.forEach((t,i)=>TAKES.push({id:"hm"+i,section:"hum",kind:"sing",text:t.t,hint:t.h,minDur:35}));
TONES.forEach(t=>TAKES.push({id:"tn"+t.n,section:"range",kind:"tone",text:"AH",note:t.n,hz:t.hz,
  hint:"Play the note, then sing AH on it and hold for six seconds.",minDur:4,skippable:true}));
[{n:"A3",hz:220,v:"EE"},{n:"C4",hz:261.63,v:"EE"},{n:"D#4",hz:311.13,v:"EE"},
 {n:"A3",hz:220,v:"OO"},{n:"C4",hz:261.63,v:"OO"},{n:"D#4",hz:311.13,v:"OO"}]
 .forEach((t,i)=>TAKES.push({id:"tv"+i,section:"range",kind:"tone",text:t.v,note:t.n,hz:t.hz,
   hint:"Same idea, different vowel. Hold six seconds.",minDur:4,skippable:true}));
// SUNG dynamics, not spoken. v2 asked for the same sentence said three ways,
// which taught the model three kinds of talking.
[
  {id:"d0",text:"Sing any line, almost whispered",hint:"Close to the mic. Breathy is good."},
  {id:"d1",text:"Sing that same line at your normal singing volume",hint:"How you would sing it to yourself."},
  {id:"d2",text:"Sing it once more, fuller",hint:"Open up a little. Not a belt \u2014 just more of you. Back off the mic slightly."}
].forEach(t=>TAKES.push({...t,section:"dynamics",kind:"sing",minDur:20}));

// ── STATE ────────────────────────────────────────────────────────────────────
let stage="intro", roomFloor=null, idx=0, recording=false, verdict=null, err="";
let takes={}, skipped={}, level=-100, hold=-100, recStart=0, livePitch=0;
let ctx=null, stream=null, analyser=null, proc=null, chunks=[], recFlag=false, raf=null, osc=null;

const dbfs = a => a<=0 ? -100 : Math.max(-100, 20*Math.log10(a));
const capturedSec = () => Object.values(takes).reduce((n,t)=>n+t.dur,0);
const mmss = s => Math.floor(s/60)+":"+String(Math.round(s%60)).padStart(2,"0");

// ── WAV ──────────────────────────────────────────────────────────────────────
// Raw PCM. MediaRecorder would hand back Opus, and training on lossy audio
// bakes the codec's artifacts permanently into the voice.
function encodeWAV(s,sr){
  const b=new ArrayBuffer(44+s.length*2), v=new DataView(b);
  const w=(o,t)=>{for(let i=0;i<t.length;i++) v.setUint8(o+i,t.charCodeAt(i));};
  w(0,"RIFF"); v.setUint32(4,36+s.length*2,true); w(8,"WAVE"); w(12,"fmt ");
  v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);
  v.setUint32(24,sr,true); v.setUint32(28,sr*2,true); v.setUint16(32,2,true); v.setUint16(34,16,true);
  w(36,"data"); v.setUint32(40,s.length*2,true);
  let o=44;
  for(let i=0;i<s.length;i++,o+=2){ const x=Math.max(-1,Math.min(1,s[i])); v.setInt16(o, x<0?x*0x8000:x*0x7fff, true); }
  return new Blob([v],{type:"audio/wav"});
}

// ── PITCH ────────────────────────────────────────────────────────────────────
// Autocorrelation on a decimated buffer. Only needs to answer "are you on the
// note", so accuracy to a few cents is plenty and speed matters more.
function detectPitch(buf,sr){
  const D=2, n=Math.floor(buf.length/D);
  const m=new Float32Array(n);
  let mean=0;
  for(let i=0;i<n;i++){ m[i]=buf[i*D]; mean+=m[i]; }
  mean/=n;
  let c0=0;
  for(let i=0;i<n;i++){ m[i]-=mean; c0+=m[i]*m[i]; }
  if(Math.sqrt(c0/n) < 0.006) return 0;
  const esr=sr/D;
  const lo=Math.max(2,Math.floor(esr/700)), hi=Math.min(Math.floor(esr/70), n-2);
  let best=-1,bv=0;
  for(let lag=lo;lag<hi;lag++){
    let s=0;
    for(let i=0;i<n-lag;i++) s+=m[i]*m[i+lag];
    s/=(n-lag);
    if(s>bv){bv=s;best=lag;}
  }
  if(best<0 || bv/(c0/n) < 0.4) return 0;
  return esr/best;
}
const centsOff = (f,t) => (!f||!t) ? null : 1200*Math.log2(f/t);

// ── MIC ──────────────────────────────────────────────────────────────────────
async function openMic(){
  err=""; render();
  try{
    // Echo cancellation, noise suppression and auto gain are all on by default
    // and all three damage training data. Auto gain is the worst: it flattens
    // exactly the dynamics that make a voice identifiable as one person's.
    stream = await navigator.mediaDevices.getUserMedia({audio:{
      echoCancellation:false, noiseSuppression:false, autoGainControl:false,
      channelCount:1, sampleRate:48000
    }});
    const AC=window.AudioContext||window.webkitAudioContext;
    ctx=new AC({sampleRate:48000});
    if(ctx.state==="suspended") await ctx.resume();
    const src=ctx.createMediaStreamSource(stream);
    analyser=ctx.createAnalyser(); analyser.fftSize=4096;
    src.connect(analyser);
    proc=ctx.createScriptProcessor(4096,1,1);
    proc.onaudioprocess=e=>{ if(recFlag) chunks.push(new Float32Array(e.inputBuffer.getChannelData(0))); };
    src.connect(proc); proc.connect(ctx.destination);
    const buf=new Float32Array(analyser.fftSize);
    let fc=0;
    (function tick(){
      analyser.getFloatTimeDomainData(buf);
      let pk=0; for(let i=0;i<buf.length;i++){ const a=Math.abs(buf[i]); if(a>pk) pk=a; }
      level=dbfs(pk); hold = level>hold ? level : hold-0.6;
      if(++fc % 3 === 0) livePitch=detectPitch(buf,ctx.sampleRate);
      paint();
      raf=requestAnimationFrame(tick);
    })();
    stage="room"; render();
  }catch(e){
    err="Couldn't open the microphone. In Safari: Settings \u2192 Websites \u2192 Microphone, set this site to Allow, then reload.";
    render();
  }
}
function teardown(){
  if(raf) cancelAnimationFrame(raf);
  if(proc) try{proc.disconnect();}catch(e){}
  if(stream) stream.getTracks().forEach(t=>t.stop());
  if(ctx) try{ctx.close();}catch(e){}
  ctx=stream=proc=null;
}

// ── REFERENCE TONE ───────────────────────────────────────────────────────────
// Triangle, not sine. A pure sine is genuinely hard to pitch against — the ear
// wants harmonics to lock onto.
function playTone(hz){
  if(!ctx) return;
  if(osc){ try{osc.stop();}catch(e){} }
  const o=ctx.createOscillator(), g=ctx.createGain();
  o.type="triangle"; o.frequency.value=hz;
  const t0=ctx.currentTime;
  g.gain.setValueAtTime(0,t0);
  g.gain.linearRampToValueAtTime(0.16,t0+0.03);
  g.gain.setValueAtTime(0.16,t0+2.2);
  g.gain.linearRampToValueAtTime(0,t0+2.6);
  o.connect(g); g.connect(ctx.destination);
  o.start(t0); o.stop(t0+2.7);
  osc=o;
}

function roomCheck(){
  const btn=document.getElementById("checkBtn"); if(btn) btn.disabled=true;
  const wrapEl=document.getElementById("checkWrap"); if(wrapEl) wrapEl.classList.remove("hide");
  const bar=document.getElementById("checkBar");
  const buf=new Float32Array(analyser.fftSize), reads=[], t0=Date.now();
  const iv=setInterval(()=>{
    analyser.getFloatTimeDomainData(buf);
    let sq=0; for(let i=0;i<buf.length;i++) sq+=buf[i]*buf[i];
    reads.push(dbfs(Math.sqrt(sq/buf.length)));
    const p=Math.min(1,(Date.now()-t0)/4000);
    if(bar) bar.style.width=(p*100)+"%";
    if(p>=1){ clearInterval(iv); reads.sort((a,b)=>a-b); roomFloor=reads[Math.floor(reads.length/2)]; render(); }
  },100);
}

// ── QUALITY GATE ─────────────────────────────────────────────────────────────
// Rejecting a bad clip costs thirty seconds. Letting one through degrades the
// model permanently, and afterwards nobody can hear which clip did it.
function judge(s,sr,floor,take){
  const dur=s.length/sr;
  let peak=0,sq=0,clip=0;
  for(let i=0;i<s.length;i++){ const a=Math.abs(s[i]); if(a>peak) peak=a; if(a>0.985) clip++; sq+=s[i]*s[i]; }
  const rmsDb=dbfs(Math.sqrt(sq/s.length)), peakDb=dbfs(peak), min=take.minDur||4;
  if(dur<min) return {ok:false,reason:"Only "+Math.round(dur)+" seconds \u2014 this one needs at least "+min+". Keep going longer."};
  if(clip>sr*0.004) return {ok:false,reason:"Distorted. Move back from the mic and go again."};
  if(peakDb<-34) return {ok:false,reason:"Too quiet to use. Move closer to the mic."};
  if(rmsDb<floor+14) return {ok:false,reason:"Your room is nearly as loud as your voice. Find somewhere quieter."};
  let note=null;
  if(peakDb<-20) note="Usable, but quiet. Move closer and the rest of the session will be better data.";
  else if(peakDb>-5) note="Close to distorting. Ease back slightly.";
  return {ok:true,dur,peakDb,note};
}

function startRec(){ verdict=null; chunks=[]; recFlag=true; recording=true; recStart=Date.now(); render(); }
function stopRec(){
  recFlag=false; recording=false;
  const total=chunks.reduce((n,c)=>n+c.length,0);
  if(!total){ verdict={ok:false,reason:"Nothing came through. Check the mic is still connected."}; render(); return; }
  const m=new Float32Array(total); let o=0;
  for(const c of chunks){ m.set(c,o); o+=c.length; }
  const sr=ctx.sampleRate, t=TAKES[idx];
  verdict=judge(m,sr,roomFloor,t);
  if(verdict.ok){
    const blob=encodeWAV(m,sr);
    takes[t.id]={blob, url:URL.createObjectURL(blob), dur:verdict.dur};
    delete skipped[t.id];
  }
  render();
}
function skipTake(){ skipped[TAKES[idx].id]=true; verdict=null; advance(); }
function advance(){
  verdict=null;
  if(idx<TAKES.length-1) idx++; else { teardown(); stage="done"; }
  render();
}
function jump(i){ if(recording) return; idx=i; verdict=null; render(); }
function downloadAll(){
  TAKES.forEach((t,i)=>{
    const r=takes[t.id]; if(!r) return;
    setTimeout(()=>{
      const a=document.createElement("a");
      a.href=r.url; a.download=String(i+1).padStart(2,"0")+"-"+t.section+"-"+t.id+".wav";
      document.body.appendChild(a); a.click(); a.remove();
    }, i*350);
  });
}

// ── SAVE TO ACCOUNT + TRAIN ─────────────────────────────────────────────────
// Uploads the recorded takes to a NEW voice profile and registers each in
// voice_clips, then the app's "Retrain my voice" button can train it.
async function saveAllAndTrain(){
  if(saving) return;
  saveErr=""; saving=true; saveMsg="Creating your voice profile\u2026"; render();
  try{
    newProfileId = await createProfile("Singing voice");
    const entries = TAKES.map((t,i)=>({t,i})).filter(x=>takes[x.t.id]);
    let seq=1;
    for(const {t} of entries){
      const rec = takes[t.id];
      saveMsg = "Uploading "+seq+" of "+entries.length+"\u2026"; render();
      await saveClip(newProfileId, t.id, t.section, rec.blob, rec.dur, seq); seq++;
    }
    saveMsg = "Saved. Starting training\u2026"; render();
    const r = await fetch("/api/voice-train", { method:"POST",
      headers:{ "Content-Type":"application/json", Authorization:"Bearer "+session.access_token } });
    const j = await r.json();
    if(!r.ok) throw new Error(j.error||"Could not start training");
    saveMsg = j.already ? "Your voice is already training." :
              "Training started \u2014 about 40 minutes. You can close this page; it trains on its own.";
    saving=false; stage="trained"; render();
  }catch(e){ saveErr=String(e.message||e); saving=false; saveMsg=""; render(); }
}

// ── UPLOAD ACAPELLA I ALREADY HAVE ──────────────────────────────────────────
// Same destination, but from files the person already recorded. RVC wants
// dry solo vocal — a warning covers backing-track uploads we can't detect.
let acapella=[];  // {file, dur, name}
async function addAcapella(files){
  saveErr="";
  for(const f of files){
    if(!/\.(wav|mp3|m4a|aif|aiff|flac|ogg)$/i.test(f.name)) continue;
    const dur = await new Promise(res=>{ const a=document.createElement("audio");
      a.preload="metadata"; a.onloadedmetadata=()=>res(a.duration||0);
      a.onerror=()=>res(0); a.src=URL.createObjectURL(f); });
    acapella.push({ file:f, dur, name:f.name });
  }
  render();
}
function removeAcapella(i){ acapella.splice(i,1); render(); }
async function saveAcapellaAndTrain(){
  if(saving) return;
  const total = acapella.reduce((a,c)=>a+(c.dur||0),0);
  if(total < 600){ saveErr = "That's "+(total/60).toFixed(1)+" min. RVC needs at least 10 minutes of dry, solo singing."; render(); return; }
  saveErr=""; saving=true; saveMsg="Creating your voice profile\u2026"; render();
  try{
    newProfileId = await createProfile("Singing voice");
    let seq=1;
    for(const c of acapella){
      saveMsg = "Uploading "+seq+" of "+acapella.length+"\u2026"; render();
      // acapella files upload as-is; the trainer slices them into 3s pieces.
      await saveClip(newProfileId, "acap"+seq, "sung", c.file, c.dur, seq); seq++;
    }
    saveMsg = "Saved. Starting training\u2026"; render();
    const r = await fetch("/api/voice-train", { method:"POST",
      headers:{ "Content-Type":"application/json", Authorization:"Bearer "+session.access_token } });
    const j = await r.json();
    if(!r.ok) throw new Error(j.error||"Could not start training");
    saveMsg = j.already ? "Your voice is already training." :
              "Training started \u2014 about 40 minutes. You can close this page; it trains on its own.";
    saving=false; stage="trained"; render();
  }catch(e){ saveErr=String(e.message||e); saving=false; saveMsg=""; render(); }
}

// ── LIVE PAINT ───────────────────────────────────────────────────────────────
function paint(){
  const pct=Math.max(0,Math.min(1,(level+60)/60))*100;
  const hpct=Math.max(0,Math.min(1,(hold+60)/60))*100;
  document.querySelectorAll(".meter").forEach(m=>{
    const f=m.querySelector(".fill"), h=m.querySelector(".hold");
    if(f){ f.style.width=pct+"%"; f.classList.toggle("hot",level>-4); }
    if(h) h.style.left=hpct+"%";
  });
  const ro=document.querySelector(".readout");
  if(ro) ro.textContent = level>-99 ? Math.round(level)+" dB" : "\u2014";

  const t=TAKES[idx];
  if(stage==="record" && t && t.kind==="tone"){
    const nd=document.getElementById("needle"), lb=document.getElementById("tunerLabel");
    if(nd){
      const c=centsOff(livePitch,t.hz);
      if(c===null){ nd.style.left="50%"; nd.classList.remove("on"); if(lb) lb.textContent="Sing the note"; }
      else{
        const cl=Math.max(-100,Math.min(100,c));
        nd.style.left=(50+cl/2.4)+"%";
        const on=Math.abs(c)<35;
        nd.classList.toggle("on",on);
        if(lb) lb.textContent = on ? "On the note" : (c<0 ? Math.round(-c)+" cents flat" : Math.round(c)+" cents sharp");
      }
    }
  }
  if(recording){
    const el=document.getElementById("recTimer");
    if(el){
      const s=(Date.now()-recStart)/1000;
      el.textContent=mmss(s);
      el.classList.toggle("short", s < (TAKES[idx].minDur||4));
    }
  }
}

const meterHTML=`<div class="meter"><div class="zone"></div><div class="fill"></div><div class="hold"></div></div>
<div class="mscale"><span>QUIET</span><span class="readout">&mdash;</span><span>TOO LOUD</span></div>`;

// ── RENDER ───────────────────────────────────────────────────────────────────
function render(){
  const app=document.getElementById("app");

  if(stage==="intro"){
    app.innerHTML=`
      <div class="eyebrow">Song Studio</div>
      <h1>Teach it your voice</h1>
      <p>About thirty minutes of recording, which produces roughly twenty minutes of usable audio. Every take is sung &mdash; there is no reading and no talking, because the model becomes whatever you feed it, and speech is what makes a trained voice sound like it is talking rather than singing.</p>
      <p>Ten songs, four humming takes, fifteen notes to sing, and one line sung three ways. Nothing here is judged on performance.</p>
      <div class="panel" style="border-color:var(--ink)">
        <div class="eyebrow" style="margin-bottom:12px">Already have singing recorded?</div>
        <p style="margin:0 0 12px">If you have fifteen or twenty minutes of dry solo vocals &mdash; acapella stems, voice memos, anything with no backing track &mdash; upload those instead. It is faster and the model is usually better, because it learns from you singing properly rather than singing to a prompt.</p>
        <div class="row"><button class="fill" onclick="stage='acapella';render()">Upload singing I already have</button></div>
      </div>
      <div class="panel">
        <div class="eyebrow" style="margin-bottom:12px">Before you start</div>
        <div class="bullet"><div class="dot"></div><div>Wired earbuds with a mic, or your phone a hand's width from your mouth. Bluetooth is worse than you'd think.</div></div>
        <div class="bullet"><div class="dot"></div><div>Quietest room you have. AC and fans off.</div></div>
        <div class="bullet"><div class="dot"></div><div>Aim for the green band on the meter. Recording too quietly is the most common mistake and it costs real quality.</div></div>
        <div class="bullet"><div class="dot"></div><div>Keep your volume up &mdash; you'll need to hear the reference notes.</div></div>
        <div class="bullet"><div class="dot"></div><div>Sing everything the way you actually sing. Soft and breathy is not a problem &mdash; it is the thing being copied.</div></div>
      </div>
      ${err?`<div class="err">${err}</div>`:""}
      <div class="row">
        <button class="fill" onclick="openMic()">Turn on my mic</button>
      </div>`;
    return;
  }

  if(stage==="acapella"){
    const total = acapella.reduce((a,c)=>a+(c.dur||0),0);
    const loginBox = !session ? `
      <div class="panel">
        <div class="eyebrow">Sign in to save</div>
        <div class="row" style="margin-bottom:10px"><input id="em2" type="email" placeholder="email" style="flex:1;min-width:200px;padding:12px;border:1px solid var(--stone);font-family:var(--body);font-size:15px"></div>
        <div class="row" style="margin-bottom:14px"><input id="pw2" type="password" placeholder="password" style="flex:1;min-width:200px;padding:12px;border:1px solid var(--stone);font-family:var(--body);font-size:15px"></div>
        <div class="row"><button class="fill" onclick="doLogin2()">Sign in</button></div>
      </div>` : "";
    app.innerHTML=`
      <div class="eyebrow">Song Studio</div>
      <h1>Upload singing you already have</h1>
      <p>Drop in dry, solo vocal recordings &mdash; your natural singing, no backing track and as little reverb as possible. That's what the model learns from. Aim for at least ten minutes across your files.</p>
      <div class="panel">
        <div class="bullet"><div class="dot"></div><div><b>Dry and solo.</b> No instrumental behind the vocal &mdash; a full song trains a muddy voice.</div></div>
        <div class="bullet"><div class="dot"></div><div><b>Your real style.</b> If you sing soft and breathy, upload soft and breathy &mdash; the model becomes what you feed it.</div></div>
        <div class="bullet"><div class="dot"></div><div><b>Clean.</b> Quiet background, minimal effects.</div></div>
      </div>
      <div class="row" style="margin-bottom:16px">
        <label class="fill" style="display:inline-block;padding:13px 26px;border:1px solid var(--ink);cursor:pointer;font-size:15px;font-weight:600;letter-spacing:.02em">
          Choose vocal files<input type="file" accept="audio/*" multiple style="display:none" onchange="addAcapella(this.files);this.value=''">
        </label>
      </div>
      ${acapella.length?`<div class="panel">${acapella.map((c,i)=>`<div class="row" style="justify-content:space-between;margin-bottom:8px"><span style="font-size:14px">${c.name} &mdash; ${mmss(c.dur||0)}</span><button class="ghost" style="padding:6px 12px" onclick="removeAcapella(${i})">Remove</button></div>`).join("")}<div style="font-size:13px;color:${total>=600?'var(--green)':'var(--red)'};margin-top:6px">${mmss(total)} total ${total>=600?'\u2014 enough to train':'\u2014 need 10:00 minimum'}</div></div>`:""}
      ${saveErr?`<p style="color:var(--red);font-size:14px">${saveErr}</p>`:""}
      ${loginBox}
      ${session&&acapella.length?`<div class="row"><button class="fill" ${saving?"disabled":""} onclick="saveAcapellaAndTrain()">${saving?(saveMsg||"Saving\u2026"):"Save & train my voice"}</button></div>`:""}
      <div style="margin-top:18px"><button class="ghost" onclick="stage='intro';render()">Back</button></div>`;
    return;
  }

  if(stage==="room"){
    let v=null;
    if(roomFloor!==null){
      v = roomFloor<-58 ? {ok:1,label:"Quiet enough",detail:"Good room. Start recording."}
        : roomFloor<-48 ? {ok:1,label:"Usable",detail:"Some background noise. It'll work, but quieter would be better."}
        : {ok:0,label:"Too noisy",detail:"Turn off fans, AC, anything humming. Move away from windows."};
    }
    app.innerHTML=`
      <div class="eyebrow">Step 1 of 2</div>
      <h1>Check your room</h1>
      <p>Stay quiet for four seconds so we can measure how loud your room is on its own. Background noise gets learned as part of your voice and can't be removed later.</p>
      <div style="margin-bottom:26px">${meterHTML}</div>
      <div id="checkWrap" class="hide" style="margin-bottom:22px">
        <div class="bar"><span id="checkBar"></span></div>
        <div style="font-size:13px;color:var(--mid);margin-top:9px">Listening &mdash; don't speak.</div>
      </div>
      ${v?`<div class="verdict${v.ok?"":" bad"}">
        <div class="vtitle" style="font-family:var(--display);color:${v.ok?"var(--green)":"var(--red)"}">${v.label}</div>
        <div class="vbody">${v.detail}</div>
        <div style="font-size:11px;color:var(--mid);margin-top:9px;letter-spacing:.06em">NOISE FLOOR ${Math.round(roomFloor)} dB</div>
      </div>`:""}
      <div class="row">
        <button id="checkBtn" class="${v?"":"fill"}" onclick="roomCheck()">${roomFloor===null?"Start the check":"Check again"}</button>
        ${v&&v.ok?`<button class="fill" onclick="stage='record';render()">Start recording</button>`:""}
      </div>`;
    return;
  }

  if(stage==="trained"){
    app.innerHTML=`
      <div class="eyebrow">Training</div>
      <h1>Your voice is training</h1>
      <p>${saveMsg||"Training started \u2014 about 40 minutes."}</p>
      <p style="font-size:13.5px">When it finishes it becomes your active voice automatically. You can watch progress on the voice card in Song Studio.</p>
      <div class="row"><button class="fill" onclick="location.href='/'">Back to Chelgy</button></div>`;
    return;
  }

  if(stage==="done"){
    const n=Object.keys(takes).length, sec=capturedSec(), short=sec<TARGET_SEC*0.7;
    const loginBox = !session ? `
      <div class="panel">
        <div class="eyebrow">Sign in to save</div>
        <p style="margin-bottom:14px;font-size:14px">Saving to your account so it can train. Same login as Chelgy.</p>
        <div class="row" style="margin-bottom:10px"><input id="em" type="email" placeholder="email" style="flex:1;min-width:200px;padding:12px;border:1px solid var(--stone);font-family:var(--body);font-size:15px"></div>
        <div class="row" style="margin-bottom:14px"><input id="pw" type="password" placeholder="password" style="flex:1;min-width:200px;padding:12px;border:1px solid var(--stone);font-family:var(--body);font-size:15px"></div>
        <div class="row"><button class="fill" onclick="doLogin()">Sign in</button></div>
      </div>` : "";
    const saveRow = session ? `
      <div class="row">
        <button class="fill" ${saving?"disabled":""} onclick="saveAllAndTrain()">${saving?(saveMsg||"Saving\u2026"):"Save to my voice & train"}</button>
        <button class="ghost" onclick="stage='record';idx=0;render()">Add more</button>
      </div>
      ${saveMsg&&!saving?`<p style="color:var(--green);margin-top:12px;font-size:14px">${saveMsg}</p>`:""}` : "";
    app.innerHTML=`
      <div class="eyebrow">Complete</div>
      <h1>${short?"Captured, but light":"That's your voice captured"}</h1>
      <p>${n} clips, ${mmss(sec)} of clean audio.
        ${short?"That's under the twenty-minute target. It'll train, but the finished voice will sound less like you than it could."
               :"That's a solid dataset."}</p>
      ${saveErr?`<p style="color:var(--red);font-size:14px">${saveErr}</p>`:""}
      ${loginBox}
      ${saveRow}
      <div style="margin-top:20px;padding-top:18px;border-top:1px solid var(--stone)">
        <button class="ghost" onclick="downloadAll()">Or download all ${n} files</button>
      </div>`;
    return;
  }

  const t=TAKES[idx], meta=SEC_META[t.section], rec=takes[t.id], sec=capturedSec();
  const isTone=t.kind==="tone";
  const body = isTone
    ? `<div class="notebox">
         <div class="notelabel">Sing this vowel</div>
         <div class="ptext huge">${t.text}</div>
         <div class="notelabel" style="color:var(--ink)">on ${t.note}</div>
       </div>
       <div class="tuner"><div class="center"></div><div class="needle" id="needle"></div></div>
       <div class="tunerlabel" id="tunerLabel">Sing the note</div>
       <div class="phint center" style="margin-top:14px">${t.hint}</div>`
    : `<div class="ptext${(t.kind==="talk"||t.kind==="sing")?" lead":""}">${t.text}</div>
       <div class="phint">${t.hint}</div>`;

  app.innerHTML=`
    <div class="rail">${TAKES.map((x,i)=>`<i class="${takes[x.id]?"done":(skipped[x.id]?"skip":(i===idx?"now":""))}" onclick="jump(${i})"></i>`).join("")}</div>
    <div class="tally">
      <span>${meta.name.toUpperCase()} &mdash; ${idx+1} OF ${TAKES.length}</span>
      <span>${mmss(sec)} OF 20:00 CAPTURED</span>
    </div>
    <div class="why">${meta.why}</div>
    <div class="prompt">${body}</div>
    ${isTone?`<div class="row" style="margin-bottom:16px"><button class="ghost" onclick="playTone(${t.hz})">&#9654; Play the note</button></div>`:""}
    <div style="margin-bottom:18px">${meterHTML}</div>
    ${recording?`<div class="timer" id="recTimer">0:00</div>
      <div style="font-size:12.5px;color:var(--mid);margin-bottom:16px">Needs at least ${t.minDur||4} seconds.</div>`:""}
    ${verdict?`<div class="verdict${verdict.ok?"":" bad"}">
      <div class="vtitle" style="color:${verdict.ok?"var(--green)":"var(--red)"}">${verdict.ok?"Got it":"Not usable"}</div>
      <div class="vbody">${verdict.ok
        ? Math.round(verdict.dur)+"s, peaked at "+Math.round(verdict.peakDb)+" dB"+(verdict.note?" \u2014 "+verdict.note:"")
        : verdict.reason}</div>
    </div>`:""}
    <div class="row">
      ${!recording?`<button class="${(!verdict||!verdict.ok)?"fill":""}" onclick="startRec()">${(verdict||rec)?"Record again":"Start recording"}</button>`:""}
      ${recording?`<button class="stop" onclick="stopRec()">Stop</button>`:""}
      ${(((verdict&&verdict.ok)||rec)&&!recording)?`<button class="fill" onclick="advance()">${idx===TAKES.length-1?"Finish":"Next"}</button>`:""}
      ${(t.skippable&&!recording&&!rec)?`<button class="ghost" onclick="skipTake()">Out of my range</button>`:""}
      ${(rec&&!recording)?`<audio src="${rec.url}" controls></audio>`:""}
    </div>`;
}
