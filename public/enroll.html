<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Teach it your voice — Chelgy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Jost:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#fff; --offwhite:#F7F6F4; --stone:#E8E6E1;
    --mid:#6B6B6B; --ink:#111; --green:#4CAF82; --red:#C0392B;
    --display:'Outfit',Helvetica,Arial,sans-serif;
    --body:'Jost',Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--cream);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
  .wrap{max-width:640px;margin:0 auto;padding:32px 20px 80px}
  h1{font-family:var(--display);font-size:30px;font-weight:600;letter-spacing:-.02em;margin:0 0 12px}
  .eyebrow{font-size:10px;letter-spacing:.18em;text-transform:uppercase;font-weight:700;color:var(--mid);margin-bottom:10px}
  p{font-size:16px;line-height:1.65;color:var(--mid);margin:0 0 22px}
  .panel{border:1px solid var(--stone);padding:20px;margin-bottom:26px}
  .bullet{display:flex;gap:12px;margin-bottom:11px}
  .bullet:last-child{margin-bottom:0}
  .dot{width:5px;height:5px;background:var(--ink);margin-top:8px;flex-shrink:0}
  .bullet div:last-child{font-size:14.5px;line-height:1.55;color:var(--ink)}
  button{font-family:var(--body);font-size:15px;font-weight:600;padding:13px 26px;cursor:pointer;
    border:1px solid var(--ink);background:transparent;color:var(--ink);letter-spacing:.02em;border-radius:0}
  button.fill{background:var(--ink);color:#fff}
  button.stop{background:var(--red);border-color:var(--red);color:#fff}
  button:disabled{opacity:.4;cursor:default}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .meter{position:relative;height:10px;background:var(--stone);overflow:hidden}
  .meter .fill{position:absolute;inset:0;width:0;background:var(--ink);transition:width 60ms linear}
  .meter .fill.hot{background:var(--red)}
  .meter .hold{position:absolute;top:0;bottom:0;width:2px;background:var(--mid);left:0}
  .meter .redline{position:absolute;top:0;bottom:0;left:93.3%;width:1px;background:var(--red);opacity:.55}
  .mscale{display:flex;justify-content:space-between;font-size:10px;color:var(--mid);margin-top:5px;letter-spacing:.08em}
  .rail{display:flex;gap:3px;margin-bottom:20px}
  .rail i{flex:1;height:3px;background:var(--stone)}
  .rail i.now{background:var(--mid)}
  .rail i.done{background:var(--ink)}
  .prompt{border:1px solid var(--stone);padding:28px 24px;margin-bottom:20px;background:var(--offwhite)}
  .ptext{font-family:var(--display);font-size:21px;font-weight:500;line-height:1.45;letter-spacing:-.01em;margin-bottom:14px;color:var(--ink)}
  .ptext.big{font-size:52px;font-weight:700;line-height:1;letter-spacing:.08em;text-align:center}
  .phint{font-size:14px;color:var(--mid);line-height:1.55}
  .phint.center{text-align:center}
  .verdict{border:1px solid var(--stone);padding:16px;margin-bottom:18px}
  .verdict.bad{border-color:var(--red)}
  .vtitle{font-size:15px;font-weight:600;margin-bottom:4px}
  .vbody{font-size:13.5px;color:var(--mid);line-height:1.5}
  .why{font-size:13.5px;color:var(--mid);line-height:1.55;margin-bottom:24px}
  .err{color:var(--red);font-size:14px;margin-bottom:16px;line-height:1.5}
  .bar{height:3px;background:var(--stone)}
  .bar span{display:block;height:100%;width:0;background:var(--ink)}
  audio{height:34px}
  .hide{display:none}
  @media (prefers-color-scheme:dark){
    :root{--cream:#0a0705;--offwhite:#141010;--stone:#2a2320;--mid:#8f867b;--ink:#efe9df;--green:#5fcf94;--red:#e0685f}
    button.fill{color:#0a0705}
    button.stop{color:#fff}
  }
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
// ── CAPTURE SCRIPT ───────────────────────────────────────────────────────────
const SECTIONS = [
  { id:"speech", name:"Speaking",
    why:"Covers the sounds your voice makes. This teaches the model your accent and how you shape words.",
    takes:[
      {id:"sp1",text:"The blue sky above the quiet harbor turned a deep orange just before the storm rolled in from the west.",hint:"Read it how you'd say it to a friend. Not a newsreader."},
      {id:"sp2",text:"She judged the vintage fabric carefully, then paid with exact change and walked six blocks home in the rain.",hint:"Same energy. Don't perform it."},
      {id:"sp3",text:"Every August my father would fix the same broken gate, and every winter the wind would break it again.",hint:"Slow down slightly. Let the ends of words finish."},
      {id:"sp4",text:"Which path you choose matters less than whether you actually walk it, month after month, without anyone watching.",hint:"Last speaking one. Relax your jaw."}
    ]},
  { id:"range", name:"Your range",
    why:"Held notes, low to high. The cleanest pitch data the model will ever get — this section matters most.",
    takes:[
      {id:"r1",text:"AH",hint:"Lowest note you can hold comfortably. Hold 5 seconds. Not your lowest possible — your lowest comfortable."},
      {id:"r2",text:"AH",hint:"A bit higher. Hold 5 seconds."},
      {id:"r3",text:"AH",hint:"Middle of your range, where talking lives. Hold 5 seconds."},
      {id:"r4",text:"OO",hint:"Same middle note, different vowel. Hold 5 seconds."},
      {id:"r5",text:"EE",hint:"Same middle note again, on EE. Hold 5 seconds."},
      {id:"r6",text:"AH",hint:"Higher. Still comfortable — no straining. Hold 5 seconds."},
      {id:"r7",text:"AH",hint:"Highest you can hold without it hurting. Hold 5 seconds."}
    ]},
  { id:"sung", name:"Singing",
    why:"Doesn't need to be good. It needs to be you, singing. The model learns what changes when you stop talking and start singing.",
    takes:[
      {id:"sg1",text:"Happy birthday to you, happy birthday to you",hint:"Any key that feels easy. Off-key is completely fine."},
      {id:"sg2",text:"Twinkle twinkle little star, how I wonder what you are",hint:"Same. Don't try to sing it well."},
      {id:"sg3",text:"Row, row, row your boat, gently down the stream",hint:"Slightly louder than the last one."},
      {id:"sg4",text:"Hmmmm",hint:"Hum any melody you like for 10 seconds. Made up is fine."}
    ]},
  { id:"dynamics", name:"Soft and loud",
    why:"Your voice changes character at different volumes. Without this the model only knows one version of you.",
    takes:[
      {id:"d1",text:"I didn't think it would happen this fast",hint:"Almost a whisper. Close to the mic."},
      {id:"d2",text:"I didn't think it would happen this fast",hint:"Normal speaking volume."},
      {id:"d3",text:"I didn't think it would happen this fast",hint:"Loud, like calling across a room. Back off the mic a little."}
    ]}
];
const TAKES = SECTIONS.flatMap(s => s.takes.map(t => ({...t, section:s.id, sectionName:s.name, why:s.why})));

// ── STATE ────────────────────────────────────────────────────────────────────
let stage="intro", roomFloor=null, idx=0, recording=false, verdict=null, err="";
let takes={}, level=-100, hold=-100;
let ctx=null, stream=null, analyser=null, proc=null, chunks=[], recFlag=false, raf=null;

const dbfs = a => a<=0 ? -100 : Math.max(-100, 20*Math.log10(a));

// ── WAV ENCODER ──────────────────────────────────────────────────────────────
// Raw PCM, not MediaRecorder's Opus. Training a voice model on lossy audio
// bakes the codec's artifacts permanently into the voice.
function encodeWAV(samples, sr){
  const buf = new ArrayBuffer(44 + samples.length*2);
  const v = new DataView(buf);
  const w = (o,s)=>{ for(let i=0;i<s.length;i++) v.setUint8(o+i, s.charCodeAt(i)); };
  w(0,"RIFF"); v.setUint32(4, 36+samples.length*2, true); w(8,"WAVE"); w(12,"fmt ");
  v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);
  v.setUint32(24,sr,true); v.setUint32(28,sr*2,true); v.setUint16(32,2,true); v.setUint16(34,16,true);
  w(36,"data"); v.setUint32(40, samples.length*2, true);
  let o=44;
  for(let i=0;i<samples.length;i++,o+=2){
    const s = Math.max(-1, Math.min(1, samples[i]));
    v.setInt16(o, s<0 ? s*0x8000 : s*0x7fff, true);
  }
  return new Blob([v], {type:"audio/wav"});
}

// ── QUALITY GATE ─────────────────────────────────────────────────────────────
// Rejecting a bad clip costs thirty seconds. Letting one through degrades the
// model permanently, and nobody can hear afterwards which clip did it.
function judge(samples, sr, floor){
  const dur = samples.length/sr;
  let peak=0, sq=0, clip=0;
  for(let i=0;i<samples.length;i++){
    const a=Math.abs(samples[i]);
    if(a>peak) peak=a;
    if(a>0.985) clip++;
    sq += samples[i]*samples[i];
  }
  const rmsDb = dbfs(Math.sqrt(sq/samples.length)), peakDb = dbfs(peak);
  if(dur < 1.6) return {ok:false, reason:"Too short. Hold until you've finished the whole line."};
  if(clip > sr*0.004) return {ok:false, reason:"Distorted — too close to the mic or too loud. Move back and go again."};
  if(peakDb < -34) return {ok:false, reason:"Too quiet to use. Move closer to the mic."};
  if(rmsDb < floor+14) return {ok:false, reason:"Your room is nearly as loud as your voice. Find somewhere quieter."};
  return {ok:true, dur, peakDb, note: (-3-peakDb) < 3 ? "Good, but close to distorting. Ease back on the next one." : null};
}

// ── MIC ──────────────────────────────────────────────────────────────────────
async function openMic(){
  err=""; render();
  try{
    // All three are ON by default and all three wreck training data. Auto gain
    // is the worst — it flattens the exact dynamics that make a voice yours.
    stream = await navigator.mediaDevices.getUserMedia({audio:{
      echoCancellation:false, noiseSuppression:false, autoGainControl:false,
      channelCount:1, sampleRate:48000
    }});
    const AC = window.AudioContext || window.webkitAudioContext;
    ctx = new AC({sampleRate:48000});
    if(ctx.state === "suspended") await ctx.resume();
    const src = ctx.createMediaStreamSource(stream);
    analyser = ctx.createAnalyser(); analyser.fftSize = 2048;
    src.connect(analyser);
    proc = ctx.createScriptProcessor(4096,1,1);
    proc.onaudioprocess = e => { if(recFlag) chunks.push(new Float32Array(e.inputBuffer.getChannelData(0))); };
    src.connect(proc); proc.connect(ctx.destination);
    const buf = new Float32Array(analyser.fftSize);
    (function tick(){
      analyser.getFloatTimeDomainData(buf);
      let pk=0; for(let i=0;i<buf.length;i++){ const a=Math.abs(buf[i]); if(a>pk) pk=a; }
      level = dbfs(pk); hold = level>hold ? level : hold-0.6;
      paintMeters();
      raf = requestAnimationFrame(tick);
    })();
    stage="room"; render();
  }catch(e){
    err = "Couldn't open the microphone. In Safari: Settings \u2192 Websites \u2192 Microphone, set this site to Allow, then reload.";
    render();
  }
}

function teardown(){
  if(raf) cancelAnimationFrame(raf);
  if(proc) try{ proc.disconnect(); }catch(e){}
  if(stream) stream.getTracks().forEach(t=>t.stop());
  if(ctx) try{ ctx.close(); }catch(e){}
  ctx=stream=proc=null;
}

function roomCheck(){
  const btn = document.getElementById("checkBtn");
  if(btn) btn.disabled = true;
  const bar = document.getElementById("checkBar");
  const wrapEl = document.getElementById("checkWrap");
  if(wrapEl) wrapEl.classList.remove("hide");
  const buf = new Float32Array(analyser.fftSize), reads=[], t0=Date.now();
  const iv = setInterval(()=>{
    analyser.getFloatTimeDomainData(buf);
    let sq=0; for(let i=0;i<buf.length;i++) sq += buf[i]*buf[i];
    reads.push(dbfs(Math.sqrt(sq/buf.length)));
    const p = Math.min(1,(Date.now()-t0)/4000);
    if(bar) bar.style.width = (p*100)+"%";
    if(p>=1){
      clearInterval(iv);
      reads.sort((a,b)=>a-b);
      roomFloor = reads[Math.floor(reads.length/2)];
      render();
    }
  },100);
}

function startRec(){ verdict=null; chunks=[]; recFlag=true; recording=true; render(); }

function stopRec(){
  recFlag=false; recording=false;
  const total = chunks.reduce((n,c)=>n+c.length,0);
  if(!total){ verdict={ok:false,reason:"Nothing came through. Check the mic is still connected."}; render(); return; }
  const merged = new Float32Array(total);
  let o=0; for(const c of chunks){ merged.set(c,o); o+=c.length; }
  const sr = ctx.sampleRate;
  verdict = judge(merged, sr, roomFloor);
  if(verdict.ok){
    const blob = encodeWAV(merged, sr);
    takes[TAKES[idx].id] = {blob, url:URL.createObjectURL(blob), dur:verdict.dur};
  }
  render();
}

function advance(){
  verdict=null;
  if(idx < TAKES.length-1){ idx++; }
  else { teardown(); stage="done"; }
  render();
}

function downloadAll(){
  TAKES.forEach((t,i)=>{
    const rec = takes[t.id]; if(!rec) return;
    setTimeout(()=>{
      const a=document.createElement("a");
      a.href=rec.url; a.download=String(i+1).padStart(2,"0")+"-"+t.section+"-"+t.id+".wav";
      document.body.appendChild(a); a.click(); a.remove();
    }, i*350);
  });
}

function paintMeters(){
  const pct = Math.max(0,Math.min(1,(level+60)/60))*100;
  const hpct = Math.max(0,Math.min(1,(hold+60)/60))*100;
  document.querySelectorAll(".meter").forEach(m=>{
    const f=m.querySelector(".fill"), h=m.querySelector(".hold"), r=m.querySelector(".readout");
    if(f){ f.style.width = pct+"%"; f.classList.toggle("hot", level > -4); }
    if(h) h.style.left = hpct+"%";
    if(r) r.textContent = level > -99 ? Math.round(level)+" dB" : "\u2014";
  });
}

const meterHTML = `<div class="meter"><div class="fill"></div><div class="hold"></div><div class="redline"></div></div>
<div class="mscale"><span>QUIET</span><span class="readout">&mdash;</span><span>DISTORTING</span></div>`;

// ── RENDER ───────────────────────────────────────────────────────────────────
function render(){
  const app = document.getElementById("app");

  if(stage==="intro"){
    app.innerHTML = `
      <div class="eyebrow">Song Studio</div>
      <h1>Teach it your voice</h1>
      <p>Eighteen short recordings, about fifteen minutes. You'll talk, hold a few notes, and sing four easy things badly. Singing badly is expected &mdash; nothing here is judged on performance.</p>
      <div class="panel">
        <div class="eyebrow" style="margin-bottom:12px">Before you start</div>
        <div class="bullet"><div class="dot"></div><div>Use wired earbuds with a mic, or your phone held a hand's width away. Bluetooth earbuds sound worse than you'd think.</div></div>
        <div class="bullet"><div class="dot"></div><div>Find the quietest room you have. Turn off the AC and any fan.</div></div>
        <div class="bullet"><div class="dot"></div><div>Don't clear your throat mid-take. Stop, then start again.</div></div>
      </div>
      ${err ? `<div class="err">${err}</div>` : ""}
      <button class="fill" onclick="openMic()">Turn on my mic</button>`;
    return;
  }

  if(stage==="room"){
    let v = null;
    if(roomFloor !== null){
      v = roomFloor < -58 ? {ok:1,label:"Quiet enough",detail:"Good room. Start recording."}
        : roomFloor < -48 ? {ok:1,label:"Usable",detail:"Some background noise. It'll work, but quieter would be better."}
        : {ok:0,label:"Too noisy",detail:"Turn off fans, AC, or anything humming. Move away from windows."};
    }
    app.innerHTML = `
      <div class="eyebrow">Step 1 of 2</div>
      <h1>Check your room</h1>
      <p>Stay quiet for four seconds so we can hear how loud your room is on its own. Background noise gets learned as part of your voice and can't be removed later.</p>
      <div style="margin-bottom:26px">${meterHTML}</div>
      <div id="checkWrap" class="hide" style="margin-bottom:22px">
        <div class="bar"><span id="checkBar"></span></div>
        <div style="font-size:13px;color:var(--mid);margin-top:9px">Listening &mdash; don't speak.</div>
      </div>
      ${v ? `<div class="verdict${v.ok?"":" bad"}">
        <div class="vtitle" style="font-family:var(--display);color:${v.ok?"var(--green)":"var(--red)"}">${v.label}</div>
        <div class="vbody">${v.detail}</div>
        <div style="font-size:11px;color:var(--mid);margin-top:9px;letter-spacing:.06em">NOISE FLOOR ${Math.round(roomFloor)} dB</div>
      </div>` : ""}
      <div class="row">
        <button id="checkBtn" class="${v?"":"fill"}" onclick="roomCheck()">${roomFloor===null?"Start the check":"Check again"}</button>
        ${v && v.ok ? `<button class="fill" onclick="stage='record';render()">Start recording</button>` : ""}
      </div>`;
    return;
  }

  if(stage==="done"){
    const n = Object.keys(takes).length;
    const secs = Math.round(Object.values(takes).reduce((a,t)=>a+t.dur,0));
    app.innerHTML = `
      <div class="eyebrow">Complete</div>
      <h1>That's your voice captured</h1>
      <p>${n} clips, ${secs} seconds of clean audio. Every one passed the noise and level checks.</p>
      <button class="fill" onclick="downloadAll()">Download all ${n} files</button>
      <div style="font-size:12.5px;color:var(--mid);margin-top:12px;line-height:1.5">Your browser will ask to allow multiple downloads &mdash; say yes. They'll land in Downloads as numbered WAV files.</div>`;
    return;
  }

  const t = TAKES[idx];
  const isRange = t.section === "range";
  const rec = takes[t.id];
  app.innerHTML = `
    <div class="rail">${TAKES.map((x,i)=>`<i class="${takes[x.id]?"done":(i===idx?"now":"")}"></i>`).join("")}</div>
    <div class="eyebrow">${t.sectionName} &mdash; ${idx+1} of ${TAKES.length}</div>
    <div class="why">${t.why}</div>
    <div class="prompt">
      <div class="ptext${isRange?" big":""}">${t.text}</div>
      <div class="phint${isRange?" center":""}">${t.hint}</div>
    </div>
    <div style="margin-bottom:20px">${meterHTML}</div>
    ${verdict ? `<div class="verdict${verdict.ok?"":" bad"}">
      <div class="vtitle" style="color:${verdict.ok?"var(--green)":"var(--red)"}">${verdict.ok?"Got it":"Not usable"}</div>
      <div class="vbody">${verdict.ok
        ? verdict.dur.toFixed(1)+"s, peaked at "+Math.round(verdict.peakDb)+" dB"+(verdict.note?" \u2014 "+verdict.note:"")
        : verdict.reason}</div>
    </div>` : ""}
    <div class="row">
      ${!recording ? `<button class="${(!verdict||!verdict.ok)?"fill":""}" onclick="startRec()">${verdict?"Record again":"Start recording"}</button>` : ""}
      ${recording ? `<button class="stop" onclick="stopRec()">Stop</button>` : ""}
      ${verdict && verdict.ok && !recording ? `<button class="fill" onclick="advance()">${idx===TAKES.length-1?"Finish":"Next"}</button>` : ""}
      ${rec && !recording ? `<audio src="${rec.url}" controls></audio>` : ""}
    </div>`;
}

render();
</script>
</body>
</html>
